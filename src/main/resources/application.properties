# PostgresSQL Connection Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/database_name
quarkus.datasource.username=database_user(default: postgres)
quarkus.datasource.password=user_password

# MongoDB Connection Configuration
quarkus.mongodb.connection-string=mongodb_connection_string
quarkus.mongodb.database=mongodb_database_name
quarkus.mongodb.dns.lookup-timeout=200S
quarkus.mongodb.dns.log-activity=true
quarkus.naming.enable-jndi=true

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=*
quarkus.http.cors.access-control-allow-credentials=true

# JWT Configuration
mp.jwt.verify.issuer=packovery-backend-jwt