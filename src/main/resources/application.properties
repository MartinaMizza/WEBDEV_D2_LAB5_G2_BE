quarkus.datasource.username=postgres
quarkus.datasource.password=${PG_PASSWORD}
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.additional-jdbc-properties.stringtype=unspecified

# MongoDB Connection Configuration
quarkus.mongodb.connection-string=mongodb+srv://alessianicolini2005_db_user:${MONGO_PASSWORD}@pw5.nube9wd.mongodb.net/
quarkus.mongodb.database=packoverydb
quarkus.mongodb.dns.lookup-timeout=200S
quarkus.mongodb.dns.log-activity=true
quarkus.naming.enable-jndi=true
