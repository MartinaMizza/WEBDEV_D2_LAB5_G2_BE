# Mailer Configuration
quarkus.mailer.auth-methods=DIGEST-MD5 CRAM-SHA256 CRAM-SHA1 CRAM-MD5 PLAIN LOGIN
quarkus.mailer.from=${EMAIL_ADDRESS}
quarkus.mailer.host=smtp.gmail.com
quarkus.mailer.port=465
quarkus.mailer.tls=true
quarkus.mailer.username=${EMAIL_USERNAME}
quarkus.mailer.password=${EMAIL_PASSWORD}
quarkus.mailer.mock=false

# Jackson Configuration
quarkus.jackson.date-format=iso8601
quarkus.jackson.serialization.write-dates-as-timestamps=false

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=*
quarkus.http.cors.access-control-allow-credentials=true

# JWT Configuration
mp.jwt.verify.issuer=packovery-backend-jwt

# Logging Configuration
quarkus.log.file.enable=true
quarkus.log.file.path=logs/app.log
quarkus.log.file.json=true
